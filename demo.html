<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS Sentinel — Demo Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   AEGIS Sentinel — design system
   "Angular SOC" — zero rounded corners, HUD brackets,
   clipped corners, skewed segments, monospace telemetry.
   ============================================================ */

:root {
  --bg: #07090B;
  --bg2: #0A0D10;
  --panel: #0D1114;
  --panel2: #11161A;
  --line: #1D262B;
  --line2: #2C3A41;
  --txt: #D9E4E7;
  --dim: #71828B;
  --faint: #46545C;
  --cyan: #1FE0FF;
  --cyan-soft: rgba(31, 224, 255, 0.08);
  --green: #3BE081;
  --amber: #FFB224;
  --red: #FF4D5E;
  --purple: #A78BFA;
  --ui: 'Chakra Petch', 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--ui);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(31, 224, 255, 0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(31, 224, 255, 0.028) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  z-index: 0;
}

.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.13) 0 1px, transparent 1px 3px);
  opacity: 0.35;
}

::selection { background: var(--cyan); color: #031014; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--line2); border: 2px solid var(--bg2); }
::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

button { font-family: var(--ui); cursor: pointer; }
input, select { font-family: var(--mono); }

.ic { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: middle; }

/* ---------------------------------------------------------- layout */

#app { display: flex; height: 100vh; position: relative; z-index: 1; }

.sidebar {
  width: 218px;
  flex: none;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  -webkit-app-region: drag;
}

.brand { display: flex; gap: 12px; align-items: center; padding: 18px 16px 14px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 38px; height: 38px; flex: none; color: var(--cyan); }
.brand-mark svg { width: 100%; height: 100%; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-weight: 700; font-size: 19px; letter-spacing: 0.22em; color: var(--txt); }
.brand-sub { font-size: 9px; letter-spacing: 0.3em; color: var(--dim); margin-top: 3px; }
.brand-sub em { font-style: normal; color: var(--cyan); }

.lic-chip {
  margin: 12px 12px 4px;
  border: 1px solid var(--line2);
  padding: 7px 10px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--amber);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
}
.lic-chip.pro { color: var(--green); border-color: rgba(59, 224, 129, 0.4); }
.lic-dot { width: 7px; height: 7px; background: currentColor; flex: none; animation: blink 2.4s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

.nav { display: flex; flex-direction: column; padding: 10px 0; flex: 1; -webkit-app-region: no-drag; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 16px;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  color: var(--dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: left;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}
.nav-item .ic { width: 16px; height: 16px; }
.nav-idx { font-family: var(--mono); font-size: 9px; color: var(--faint); letter-spacing: 0.05em; }
.nav-item:hover { color: var(--txt); background: var(--cyan-soft); }
.nav-item.active { color: var(--cyan); border-left-color: var(--cyan); background: var(--cyan-soft); }
.nav-item.active .nav-idx { color: var(--cyan); }
.nav-foot { border-top: 1px solid var(--line); -webkit-app-region: no-drag; }
.nav-pro { color: var(--amber); width: 100%; justify-content: flex-start; }
.nav-pro:hover { color: var(--amber); background: rgba(255, 178, 36, 0.08); }
.pro-arrow { margin-left: auto; }
.pro-arrow .ic { width: 13px; height: 13px; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------------------------------------------------------- titlebar */

.titlebar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0 0 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  -webkit-app-region: drag;
}
.crumb { font-size: 11px; font-weight: 600; letter-spacing: 0.24em; color: var(--dim); }
.crumb b { color: var(--cyan); font-weight: 600; }
.titlebar-right { display: flex; align-items: center; height: 100%; -webkit-app-region: no-drag; }
.clock { font-family: var(--mono); font-size: 12px; color: var(--dim); padding: 0 16px; letter-spacing: 0.1em; }
.tb-sep { width: 1px; height: 100%; background: var(--line); }
.tb-btn {
  width: 46px; height: 100%;
  background: none; border: none; border-left: 1px solid var(--line);
  color: var(--dim); display: flex; align-items: center; justify-content: center;
}
.tb-btn .ic { width: 14px; height: 14px; }
.tb-btn:hover { background: var(--cyan-soft); color: var(--cyan); }
.tb-btn.tb-close:hover { background: rgba(255, 77, 94, 0.12); color: var(--red); }

/* ---------------------------------------------------------- content */

#view { flex: 1; overflow-y: auto; padding: 26px 30px 40px; position: relative; }

.statusbar {
  height: 30px; flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--dim);
}
.sb-sep { color: var(--faint); }
.sb-right { margin-left: auto; color: var(--cyan); }
.sb-right.busy { color: var(--amber); }

/* ---------------------------------------------------------- primitives */

.sec-head { display: flex; align-items: center; gap: 12px; margin: 26px 0 14px; }
.sec-head:first-child { margin-top: 0; }
.sec-sq { width: 8px; height: 8px; background: var(--cyan); flex: none; }
.sec-title { font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--txt); }
.sec-line { flex: 1; height: 1px; background: var(--line); }
.sec-idx { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.1em; }

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 18px 20px;
}
.card.tick::before, .card.tick::after {
  content: ""; position: absolute; width: 11px; height: 11px; pointer-events: none;
}
.card.tick::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.card.tick::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

.card-title { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.card-title .ic { width: 14px; height: 14px; color: var(--cyan); }

.hatch {
  background-image: repeating-linear-gradient(45deg, rgba(31, 224, 255, 0.035) 0 1px, transparent 1px 9px);
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1350px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }

/* buttons — clipped corner, angular */
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  background: transparent;
  border: 1px solid var(--line2);
  color: var(--txt);
  padding: 10px 18px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  transition: all 0.15s;
}
.btn .ic { width: 14px; height: 14px; }
.btn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-soft); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary {
  background: var(--cyan); border-color: var(--cyan); color: #031014; font-weight: 700;
  clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 0 100%);
}
.btn-primary:hover { background: #7DF0FF; color: #031014; }
.btn-danger:hover { border-color: var(--red); color: var(--red); background: rgba(255, 77, 94, 0.08); }
.btn-sm { padding: 6px 12px; font-size: 10px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* badges & chips */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 4px 8px; border: 1px solid var(--line2); color: var(--dim);
}
.badge .dot { width: 6px; height: 6px; background: currentColor; flex: none; }
.badge.ok { color: var(--green); border-color: rgba(59, 224, 129, 0.45); }
.badge.warn { color: var(--amber); border-color: rgba(255, 178, 36, 0.45); }
.badge.crit { color: var(--red); border-color: rgba(255, 77, 94, 0.5); }
.badge.info { color: var(--cyan); border-color: rgba(31, 224, 255, 0.4); }
.badge.neutral { color: var(--dim); }

.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 10px; color: var(--dim);
  border: 1px solid var(--line); background: var(--bg2);
  padding: 6px 10px; letter-spacing: 0.06em;
}
.chip b { color: var(--txt); font-weight: 500; }
.chip .ic { width: 12px; height: 12px; color: var(--cyan); }

/* stat cards */
.stat .stat-label { font-size: 9px; font-weight: 700; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase; }
.stat .stat-value { font-size: 30px; font-weight: 700; color: var(--txt); margin: 8px 0 2px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.stat .stat-value small { font-size: 14px; color: var(--dim); font-weight: 600; margin-left: 4px; }
.stat .stat-sub { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.05em; }
.stat .stat-bar { height: 4px; background: var(--line); margin-top: 12px; position: relative; overflow: hidden; }
.stat .stat-bar i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); }
.stat.warn .stat-bar i { background: var(--amber); }
.stat.crit .stat-bar i { background: var(--red); }
.stat.ok .stat-bar i { background: var(--green); }

/* health gauge — skewed segments */
.gauge { display: flex; gap: 3px; margin: 14px 0 6px; }
.gauge i { flex: 1; height: 30px; background: var(--line); transform: skewX(-14deg); transition: background 0.3s; }
.gauge i.on { background: currentColor; }
.gauge-legend { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--faint); letter-spacing: 0.12em; }

.score-num { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.score-num small { font-size: 22px; color: var(--dim); font-weight: 600; }
.score-grade {
  display: inline-block; margin-top: 10px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.3em;
  padding: 6px 14px 6px 18px; border: 1px solid currentColor;
}

/* tables */
.table-wrap { border: 1px solid var(--line); background: var(--panel); overflow: auto; max-height: 520px; }
table.data { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
table.data th {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel2);
  text-align: left; padding: 10px 12px;
  font-family: var(--ui); font-size: 9px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim);
  border-bottom: 1px solid var(--line2);
  white-space: nowrap; user-select: none;
}
table.data th.sortable { cursor: pointer; }
table.data th.sortable:hover { color: var(--cyan); }
table.data th .sort-ic { color: var(--cyan); margin-left: 4px; }
table.data td { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--txt); white-space: nowrap; }
table.data tbody tr { transition: background 0.1s; }
table.data tbody tr:hover { background: var(--cyan-soft); box-shadow: inset 2px 0 0 var(--cyan); }
table.data td.dim { color: var(--dim); }
table.data td.mono { font-family: var(--mono); }
.row-crit { box-shadow: inset 3px 0 0 var(--red); }
.row-high { box-shadow: inset 3px 0 0 var(--amber); }
.row-med { box-shadow: inset 3px 0 0 var(--cyan); }
.cell-main { color: var(--txt); font-weight: 500; }
.cell-sub { display: block; font-size: 9.5px; color: var(--faint); margin-top: 2px; }
.path-cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }

/* cpu / mem mini bars */
.mini-bar { display: inline-block; width: 90px; height: 8px; background: var(--line); position: relative; vertical-align: middle; margin-right: 8px; transform: skewX(-14deg); }
.mini-bar i { position: absolute; inset: 0 auto 0 0; }
.mini-bar i.g { background: var(--green); } .mini-bar i.a { background: var(--amber); } .mini-bar i.r { background: var(--red); }

/* inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
.input, select.input {
  background: var(--bg2); border: 1px solid var(--line2); color: var(--txt);
  padding: 10px 12px; font-size: 12px; outline: none; width: 100%;
  transition: border-color 0.15s;
}
.input:focus { border-color: var(--cyan); }
.input::placeholder { color: var(--faint); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .input { width: auto; min-width: 220px; }
.toolbar .spacer { flex: 1; }

/* progress */
.progress { height: 10px; background: var(--line); position: relative; overflow: hidden; border: 1px solid var(--line2); }
.progress > i {
  position: absolute; inset: 0; width: 35%;
  background: repeating-linear-gradient(90deg, var(--cyan) 0 10px, rgba(31, 224, 255, 0.35) 10px 14px);
  animation: slide 1.1s linear infinite;
}
@keyframes slide { from { left: -35%; } to { left: 100%; } }

/* scan console */
.console {
  background: #050708; border: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--dim);
  padding: 14px 16px; height: 190px; overflow-y: auto; line-height: 1.75;
}
.console .ln { white-space: pre-wrap; }
.console .ln.ok { color: var(--green); }
.console .ln.cy { color: var(--cyan); }
.console .ln.warn { color: var(--amber); }
.console .cursor { display: inline-block; width: 7px; height: 12px; background: var(--cyan); vertical-align: -2px; animation: blink 1s steps(2) infinite; }

/* ticker */
.ticker { overflow: hidden; border: 1px solid var(--line); background: var(--panel); margin-top: 16px; }
.ticker-label {
  position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
  display: flex; align-items: center; padding: 0 12px;
  background: var(--cyan); color: #031014;
  font-size: 9px; font-weight: 700; letter-spacing: 0.22em;
}
.ticker { position: relative; padding-left: 110px; }
.ticker-track { display: inline-flex; gap: 40px; white-space: nowrap; padding: 9px 0; animation: tick 40s linear infinite; will-change: transform; }
.ticker:hover .ticker-track { animation-play-state: paused; }
.ticker-track span { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.05em; }
.ticker-track span b { color: var(--txt); font-weight: 500; }
.ticker-track span.crit b { color: var(--red); }
.ticker-track span.ok b { color: var(--green); }
@keyframes tick { to { transform: translateX(-50%); } }

/* locked / freemium overlay */
.locked-row td {
  background: repeating-linear-gradient(45deg, rgba(255, 178, 36, 0.05) 0 8px, transparent 8px 16px);
  text-align: center; padding: 22px !important;
}
.locked-box {
  display: inline-flex; align-items: center; gap: 14px;
  border: 1px solid rgba(255, 178, 36, 0.5); padding: 12px 20px; background: var(--panel2);
}
.locked-box .ic { color: var(--amber); width: 20px; height: 20px; }
.locked-box span { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
.blur-zone { filter: blur(3px); pointer-events: none; user-select: none; }

/* list rows (findings, suspicious) */
.list-row {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 2px; border-bottom: 1px solid var(--line);
}
.list-row:last-child { border-bottom: none; }
.list-row .ic { width: 15px; height: 15px; margin-top: 2px; flex: none; }
.list-row .lr-body { flex: 1; min-width: 0; }
.list-row .lr-title { font-size: 12px; font-weight: 600; color: var(--txt); }
.list-row .lr-sub { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 2px; word-break: break-all; }
.sev-ic.crit { color: var(--red); } .sev-ic.high { color: var(--amber); } .sev-ic.med { color: var(--cyan); } .sev-ic.info { color: var(--dim); } .sev-ic.ok { color: var(--green); }

.empty {
  text-align: center; padding: 50px 20px; color: var(--dim);
  border: 1px dashed var(--line2);
}
.empty .ic { width: 30px; height: 30px; color: var(--faint); margin-bottom: 12px; }
.empty p { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; }

/* audit checklist */
.audit-item { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-left-width: 3px; }
.audit-item.ok { border-left-color: var(--green); }
.audit-item.warn { border-left-color: var(--amber); }
.audit-item.crit { border-left-color: var(--red); }
.audit-item .ic { width: 20px; height: 20px; flex: none; }
.audit-item.ok .ic { color: var(--green); } .audit-item.warn .ic { color: var(--amber); } .audit-item.crit .ic { color: var(--red); }
.audit-item .ai-body { flex: 1; min-width: 0; }
.audit-item .ai-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.audit-item .ai-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 3px; }

/* pro / pricing */
.pro-hero {
  position: relative; overflow: hidden;
  border: 1px solid var(--line2);
  background: var(--panel);
  padding: 34px 36px;
  clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
}
.pro-hero h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.18em; color: var(--txt); }
.pro-hero h1 em { font-style: normal; color: var(--cyan); }
.pro-hero p { margin-top: 10px; color: var(--dim); font-size: 13px; letter-spacing: 0.06em; max-width: 560px; line-height: 1.7; }
.pro-hero .hatch-bg { position: absolute; right: -40px; top: -40px; width: 320px; height: 320px; opacity: 0.5; pointer-events: none; }

.price-card { cursor: pointer; transition: all 0.15s; position: relative; }
.price-card:hover { border-color: var(--line2); }
.price-card.selected { border-color: var(--cyan); box-shadow: inset 0 3px 0 var(--cyan); }
.price-card.selected::before { content: "SELECTED"; position: absolute; top: -1px; right: -1px; background: var(--cyan); color: #031014; font-size: 8px; font-weight: 700; letter-spacing: 0.2em; padding: 4px 8px; }
.price { font-size: 34px; font-weight: 700; color: var(--txt); margin: 10px 0 2px; }
.price small { font-size: 12px; color: var(--dim); font-weight: 600; }
.price-card ul { list-style: none; margin-top: 14px; }
.price-card li { display: flex; gap: 9px; align-items: center; font-size: 11.5px; color: var(--dim); padding: 5px 0; letter-spacing: 0.04em; }
.price-card li .ic { width: 13px; height: 13px; color: var(--green); }

.feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
@media (max-width: 1350px) { .feat-grid { grid-template-columns: repeat(2, 1fr); } }
.feat { border: 1px solid var(--line); background: var(--panel); padding: 16px; }
.feat .ic { color: var(--cyan); width: 20px; height: 20px; }
.feat h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; margin: 10px 0 6px; }
.feat p { font-size: 11px; color: var(--dim); line-height: 1.65; }

/* modal */
#modal-root { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
#modal-root:empty { pointer-events: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(4, 6, 8, 0.82); backdrop-filter: blur(3px); }
.modal {
  position: relative; width: 560px; max-width: calc(100vw - 48px); max-height: calc(100vh - 80px);
  overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line2);
  padding: 28px; z-index: 1;
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
  animation: modalIn 0.18s ease-out;
}
.modal.wide { width: 760px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-head h3 { font-size: 14px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
.modal-head h3 em { font-style: normal; color: var(--cyan); }
.modal-x { background: none; border: 1px solid var(--line2); color: var(--dim); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.modal-x:hover { color: var(--red); border-color: var(--red); }
.modal-x .ic { width: 13px; height: 13px; }

/* toast */
#toast-root { position: fixed; right: 20px; bottom: 44px; z-index: 60; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--cyan);
  padding: 13px 18px; min-width: 300px; max-width: 420px;
  font-size: 12px; color: var(--txt);
  animation: toastIn 0.2s ease-out;
}
.toast .ic { width: 15px; height: 15px; color: var(--cyan); flex: none; }
.toast.success { border-left-color: var(--green); } .toast.success .ic { color: var(--green); }
.toast.error { border-left-color: var(--red); } .toast.error .ic { color: var(--red); }
.toast.warn { border-left-color: var(--amber); } .toast.warn .ic { color: var(--amber); }
.toast.out { opacity: 0; transform: translateX(12px); transition: all 0.3s; }
@keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

/* misc */
.muted { color: var(--dim); }
.mono { font-family: var(--mono); }
.right { text-align: right; }
.mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.flex { display: flex; } .items-center { align-items: center; } .gap10 { gap: 10px; } .flex1 { flex: 1; }
.hero-kpi { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.divider-v { width: 1px; align-self: stretch; background: var(--line); }
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; }

.spinner {
  width: 14px; height: 14px; flex: none;
  border: 2px solid var(--line2); border-top-color: var(--cyan);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* checkbox — square */
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none;
  width: 15px; height: 15px; border: 1px solid var(--line2);
  background: var(--bg2); cursor: pointer; position: relative; flex: none;
}
input[type="checkbox"]:hover { border-color: var(--cyan); }
input[type="checkbox"]:checked { background: var(--cyan); border-color: var(--cyan); }
input[type="checkbox"]:checked::after {
  content: ""; position: absolute; left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: solid #031014; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmtBytes = (n) => {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB', 'TB', 'PB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n >= 100 ? 0 : 1) + ' ' + u[i];
};
const fmtNum = (n) => Number(n || 0).toLocaleString('en-US');
const clampPct = (n) => Math.max(0, Math.min(100, Math.round(n || 0)));
const barClass = (p) => (p >= 85 ? 'r' : p >= 60 ? 'a' : 'g');
const timeAgo = (iso) => {
  if (!iso) return 'never';
  const d = new Date(iso);
  if (isNaN(d)) return 'unknown';
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};

async function api(channel, payload) {
  const res = await IPC.invoke(channel, payload);
  if (!res || res.ok === false) {
    toast((res && res.error) || 'Operation failed', 'error');
    return null;

  return res.data;

/* ------------------------------------------------------------ toast / modal */
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const ic = type === 'success' ? 'check' : type === 'error' ? 'x' : type === 'warn' ? 'warn' : 'info';
  t.innerHTML = icon(ic) + `<span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 4200);
}

function openModal(html, wide = false) {
  $('#modal-root').innerHTML =
    `<div class="modal-backdrop" id="modal-bg"></div><div class="modal${wide ? ' wide' : ''}">${html}</div>`;
  $('#modal-bg').addEventListener('click', closeModal);
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function confirmDialog(title, msg, danger, onYes) {
  openModal(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" id="m-x">${icon('x')}</button></div>
    <p style="color:var(--dim);font-size:13px;line-height:1.7">${esc(msg)}</p>
    <div class="btn-row mt24">
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="m-ok">${danger ? 'CONFIRM' : 'CONTINUE'}</button>
      <button class="btn" id="m-cancel">CANCEL</button>
    </div>`);
  $('#m-x').onclick = closeModal;
  $('#m-cancel').onclick = closeModal;
  $('#m-ok').onclick = () => { closeModal(); onYes(); };
}

/* ------------------------------------------------------------ gating */
function gate(feature, fn) {
  if (isPro()) return fn();
  openProModal(feature);
}

/* ------------------------------------------------------------ statusbar */
function setBusy(busy, label) {
  const el = $('#sb-status');
  el.textContent = busy ? (label || 'WORKING') : 'READY';

}

function gaugeHtml(score) {
  const segs = 25;
  const lit = Math.round((score / 100) * segs);
  const color = score >= 75 ? 'var(--green)' : score >= 50 ? 'var(--amber)' : 'var(--red)';
  let s = `<div class="gauge" style="color:${color}">`;
  for (let i = 0; i < segs; i++) s += `<i class="${i < lit ? 'on' : ''}"></i>`;
  return s + '</div>';
}

const scanState = { running: false };
async function startQuickScan() {
  if (scanState.running) return; // re-entrancy guard: init -> startQuickScan -> navigate -> init
  scanState.running = true;
  setBusy(true, 'SCANNING');
  navigate('dashboard'); // shows loading view
  const c = $('#scan-console');
  const log = (txt, cls = '') => {
    if (!c) return;
    const div = document.createElement('div');
    div.className = 'ln ' + cls;
    div.textContent = txt;
    c.appendChild(div);
    c.scrollTop = c.scrollHeight;
  };
  log('> aegis engine v1.0.0 — initialising sensors');
  await sleep(140);
  log('> reading system information & hardware profile');
  await sleep(140);
  log('> profiling processes (two-pass CPU sampling)');
  await sleep(140);
  log('> checking firewall, encryption & update state');
  await sleep(140);
  log('> parsing system error logs (last 24h)');
  await sleep(140);
  log('> sweeping temp, cache & log storage');
  const res = await api('scan:quick');
  if (res) {
    log('> computing health score ...', 'cy');
    state.scan = res;
    state.sys = res.system;
    state.scanAt = new Date().toISOString();
    setLastScan('LAST SCAN ' + new Date().toLocaleTimeString());
    log('> scan complete in ' + (res.durationMs / 1000).toFixed(1) + 's — health ' + res.score.score + '/100 (grade ' + res.score.grade + ')', 'ok');
    navigate('dashboard');
  }
  scanState.running = false;
  setBusy(false);
}

      $$('.sel').forEach((c) => { c.checked = selAll.checked; });
      $('#btn-clean').disabled = !selAll.checked;

    const clean = $('#btn-clean');
    if (clean) clean.addEventListener('click', cleanSelected);

async function runFilesScan() {
  if (filesState.busy) return;
  filesState.busy = true;
  setBusy(true, 'FILE SCAN');
  $('#f-progress').style.display = 'block';
  $('#f-scan').disabled = true;
  const statuses = ['Sweeping filesystem…', 'Hashing candidates…', 'Classifying artifacts…', 'Computing reclaimable space…'];
  let si = 0;
  const timer = setInterval(() => { si = (si + 1) % statuses.length; $('#f-status').textContent = statuses[si]; }, 900);
  activeTimers.push(timer);
  const mode = $('#f-mode').value;
  const payload = {
    mode,
    minSize: (parseInt($('#f-size').value, 10) || 100) * 1024 * 1024,
    roots: ($('#f-path').value || '').trim() ? [$('#f-path').value.trim()] : undefined,
  };
  const res = await api('scan:files', payload);
  clearInterval(timer);
  filesState.busy = false;
  setBusy(false);
  $('#f-progress').style.display = 'none';
  $('#f-scan').disabled = false;
  if (res) {
    filesState.result = res;
    VIEWS.files.render && navigate('files');
    toast(`Scan complete — ${res.count} item(s), ${fmtBytes(res.reclaimable)} reclaimable`, 'success');
  }
}

function cleanSelected() {
  const paths = $$('.sel').filter((c) => c.checked).map((c) => c.dataset.path);
  if (!paths.length) return;
  confirmDialog('Delete files', `Permanently delete ${paths.length} selected file(s)? This cannot be undone.`, true, async () => {
    setBusy(true, 'CLEANING');
    const res = await api('files:clean', { paths });
    setBusy(false);
    if (res) {
      toast(`Removed ${res.removed} file(s) — ${fmtBytes(res.bytes)} freed${res.failed ? ` (${res.failed} failed)` : ''}`, res.failed ? 'warn' : 'success');
      filesState.result = null;
      navigate('files');
    }
  });
}

const procState = { list: [], sortKey: 'suspicion', sortDir: -1, filter: '', auto: true };

VIEWS.processes = {
  label: 'Processes',
  render() {
    const q = procState.filter.toLowerCase();
    let rows = procState.list.filter((p) =>
      !q || p.name.toLowerCase().includes(q) || String(p.pid).includes(q) || (p.path || '').toLowerCase().includes(q));
    rows = [...rows].sort((a, b) => {
      const k = procState.sortKey;
      const va = a[k] == null ? 0 : a[k];
      const vb = b[k] == null ? 0 : b[k];
      const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
      return cmp * procState.sortDir;
    });
    const susp = procState.list.filter((p) => p.suspicion > 0).length;
    const highCpu = procState.list.filter((p) => (p.cpu || 0) >= 60).length;
    const th = (key, label) =>
      `<th class="sortable" data-sort="${key}">${label}${procState.sortKey === key ? `<span class="sort-ic">${procState.sortDir === 1 ? '▲' : '▼'}</span>` : ''}</th>`;
    return `
      <div class="sec-head"><span class="sec-sq"></span><span class="sec-title">Process Monitor</span><span class="sec-line"></span><span class="sec-idx">LIVE PROFILES</span></div>
      <div class="toolbar">
        <span class="chip">${icon('chip')} <b>${procState.list.length}</b> processes</span>
        <span class="chip">${icon('warn')} <b>${susp}</b> flagged</span>
        <span class="chip">${icon('zap')} <b>${highCpu}</b> high CPU</span>
        <span class="spacer"></span>
        <input class="input" id="p-filter" placeholder="Filter by name / pid / path…" value="${esc(procState.filter)}" />
        <button class="btn ${procState.auto ? 'btn-primary' : ''}" id="p-auto">${icon('refresh')} AUTO ${procState.auto ? 'ON' : 'OFF'}</button>
        <button class="btn" id="p-refresh">${icon('refresh')} Refresh</button>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr>${th('pid', 'PID')}${th('name', 'Process')}${th('cpu', 'CPU')}${th('memBytes', 'Memory')}${th('path', 'Executable Path')}${th('suspicion', 'Risk')}<th></th></tr></thead>
          <tbody>
            ${rows.slice(0, 300).map((p) => {

              return `<tr class="${rowCls}">

                <td><span class="mini-bar"><i class="${barClass(p.cpu || 0)}" style="width:${clampPct(p.cpu)}%"></i></span><span class="mono">${(p.cpu || 0).toFixed(1)}%</span></td>

    $('#p-filter').addEventListener('input', (e) => { procState.filter = e.target.value; renderRowsOnly(); });
    $$('th.sortable').forEach((h) => h.addEventListener('click', () => {
      const k = h.dataset.sort;
      if (procState.sortKey === k) procState.sortDir *= -1;
      else { procState.sortKey = k; procState.sortDir = k === 'name' || k === 'path' ? 1 : -1; }
      renderRowsOnly();
    }));
    $$('[data-kill]').forEach((b) => b.addEventListener('click', () => killProcess(parseInt(b.dataset.kill, 10))));
    if (procState.auto) {
      activeTimers.push(setInterval(() => { if (state.route === 'processes') loadProcesses(true); }, 4000));

};

function renderRowsOnly() { navigate('processes'); }

async function loadProcesses(silent = false) {
  if (!silent) setBusy(true, 'PROCESS SCAN');
  const res = await api('proc:list');
  if (res) {
    procState.list = res;
    if (state.route === 'processes') navigate('processes');
  }
  if (!silent) setBusy(false);
}

function killProcess(pid) {
  confirmDialog('End process', `Force-stop process PID ${pid}? Unsaved data in that process will be lost.`, true, async () => {
    setBusy(true, 'STOPPING PROCESS');
    const res = await api('proc:kill', { pid });
    setBusy(false);
    if (res && res.ok) { toast(`Process ${pid} terminated`, 'success'); loadProcesses(); }
    else if (res) toast(res.error || 'Could not stop process', 'error');
  });
}

function renderConnections(q) {
  const n = VIEWS.network.data;
  const tbody = $('#n-tbody');

  const qq = (q || '').toLowerCase();
  const rows = n.net.connections.filter((c) =>

  tbody.innerHTML = rows.slice(0, 400).map((c) => {
    const st = /LISTEN/i.test(c.state)
      ? '<span class="badge info"><span class="dot"></span>LISTEN</span>'

        ? '<span class="badge ok"><span class="dot"></span>ESTABLISHED</span>'
        : `<span class="badge neutral"><span class="dot"></span>${esc(c.state || '—')}</span>`;

async function runAudit() {
  setBusy(true, 'AUDIT');
  const t0 = Date.now();
  const [firewall, encryption, updates, errors, procs, disks, net] = await Promise.all([
    api('fw:status'), api('enc:status'), api('updates:check'), api('errors:list'), api('proc:list'), api('disk:usage'), api('net:list'),
  ]);
  const susp = (procs || []).filter((p) => p.suspicion >= 30);
  const disk = (disks || [])[0] || {};
  const diskPct = disk.size ? (disk.used / disk.size) * 100 : 0;
  const errs = (errors && errors.items) || [];
  const upd = (updates && updates.items) || [];
  const items = [
    {
      title: 'Firewall active', status: firewall && firewall.enabled === true ? 'ok' : 'crit',
      detail: firewall ? firewall.details : 'no data',
      action: firewall && firewall.enabled === false ? 'fw' : null, actionLabel: firewall && firewall.enabled === false ? 'Enable now' : null, actionDanger: false,
    },
    {
      title: 'Disk encryption', status: encryption && encryption.enabled === true ? 'ok' : encryption && encryption.enabled === false ? 'warn' : 'warn',
      detail: encryption ? encryption.details : 'no data',
      action: 'enc', actionLabel: 'How to enable', actionDanger: false,
    },
    {
      title: 'System updates', status: upd.length === 0 && !(updates && updates.rebootRequired) ? 'ok' : 'warn',
      detail: upd.length ? upd.length + ' pending update(s)' : (updates && updates.note) || 'up to date',
      action: 'upd', actionLabel: upd.length ? 'Review updates' : null, actionDanger: false,
    },
    {
      title: 'System errors (24h)', status: errs.length === 0 ? 'ok' : 'warn',
      detail: errs.length ? errs.length + ' error event(s) in the last 24 hours' : 'no errors logged',
      action: 'err', actionLabel: errs.length ? 'Inspect logs' : null, actionDanger: false,
    },
    {
      title: 'Suspicious processes', status: susp.length === 0 ? 'ok' : 'crit',
      detail: susp.length ? susp.map((p) => p.name + ' (risk ' + p.suspicion + ')').join(', ') : 'no suspicious processes running',
      action: 'proc', actionLabel: susp.length ? 'Review processes' : null, actionDanger: true,
    },
    {
      title: 'Disk space', status: diskPct < 85 ? 'ok' : diskPct < 92 ? 'warn' : 'crit',
      detail: disk.mount ? disk.mount + ' — ' + diskPct.toFixed(0) + '% used (' + fmtBytes(disk.free) + ' free)' : 'no data',
      action: 'disk', actionLabel: 'Find large files', actionDanger: false,
    },
    {
      title: 'Exposed listening ports', status: net && net.listening.length <= 10 ? 'ok' : 'warn',
      detail: net ? net.listening.length + ' listening port(s) — review services that accept external connections' : 'no data',
      action: 'net', actionLabel: 'Inspect network', actionDanger: false,
    },
  ];
  VIEWS.audit.data = { items, at: new Date().toLocaleString(), ms: Date.now() - t0, raw: { firewall, encryption, updates, errors, susp, disk, disks, net } };
  if (state.route === 'audit') navigate('audit');
  setBusy(false);
}

function auditAction(act) {
  if (act === 'fw') gate('Automatic firewall repair', enableFirewallNow);
  if (act === 'upd') navigate('updates');
  if (act === 'proc') navigate('processes');
  if (act === 'disk') { filesState.result = null; navigate('files'); setTimeout(() => { $('#f-mode').value = 'large'; }, 30); }
  if (act === 'net') navigate('network');
  if (act === 'err') {
    const errs = (VIEWS.audit.data.raw.errors.items || []).slice(0, 40)
      .map((e) => `<div class="list-row"><div class="lr-body"><div class="lr-title" style="font-family:var(--mono);font-size:10.5px">${esc(e.time)} · ${esc(e.source)}</div><div class="lr-sub">${esc(e.message)}</div></div></div>`).join('');
    openModal(`<div class="modal-head"><h3>System <em>Errors</em> — 24h</h3><button class="modal-x" id="m-x">${icon('x')}</button></div>${errs || '<p class="muted">No errors logged.</p>'}`, true);
    $('#m-x').onclick = closeModal;
  }
  if (act === 'enc') {
    const osLabel = state.sys ? state.sys.platformLabel : 'your OS';
    openModal(`
      <div class="modal-head"><h3>Enable <em>Encryption</em></h3><button class="modal-x" id="m-x">${icon('x')}</button></div>
      <div style="color:var(--dim);font-size:12.5px;line-height:1.8">
        <p><b style="color:var(--txt)">Windows:</b> enable BitLocker — Settings → Privacy &amp; Security → Device encryption, or run <span class="mono" style="color:var(--cyan)">manage-bde -on C:</span> as Administrator.</p>
        <p style="margin-top:10px"><b style="color:var(--txt)">macOS:</b> System Settings → Privacy &amp; Security → FileVault → Turn On.</p>
        <p style="margin-top:10px"><b style="color:var(--txt)">Linux:</b> install with full-disk LUKS, or add a encrypted home/crypt container with <span class="mono" style="color:var(--cyan)">cryptsetup</span>.</p>
      </div>
      <div class="btn-row mt24"><button class="btn btn-primary" id="m-ok">GOT IT</button></div>`);
    $('#m-x').onclick = closeModal;
    $('#m-ok').onclick = closeModal;
  }
}

      <div class="grid-3">
        <div class="card stat"><div class="stat-label">Pending Updates</div><div class="stat-value">${items.length}</div><div class="stat-sub">${esc(u.note || '')}</div></div>
        <div class="card stat"><div class="stat-label">Last Installed</div><div class="stat-value" style="font-size:22px">${u.lastInstalled ? esc(u.lastInstalled) : 'n/a'}</div><div class="stat-sub">most recent patch</div></div>
        <div class="card stat ${u.rebootRequired ? 'warn' : 'ok'}"><div class="stat-label">Restart</div><div class="stat-value" style="font-size:22px">${u.rebootRequired ? 'REQUIRED' : 'NOT REQUIRED'}</div><div class="stat-sub">to finish updates</div></div>
      </div>
      <div class="btn-row mt16">
        <button class="btn" id="u-refresh">${icon('refresh')} Re-check</button>
        <button class="btn btn-primary" id="u-install">${icon('download')} Install All Updates</button>
      </div>
      <div class="sec-head"><span class="sec-sq"></span><span class="sec-title">Available Updates</span><span class="sec-line"></span></div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Update</th><th>Version / KB</th><th>Source</th><th class="right">Size</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${u.history && u.history.length ? `
      <div class="sec-head"><span class="sec-sq"></span><span class="sec-title">Recent Update History</span><span class="sec-line"></span></div>
      <div class="table-wrap" style="max-height:240px">
        <table class="data">
          <thead><tr><th>HotFix</th><th>Description</th><th>Installed</th></tr></thead>
          <tbody>${u.history.map((h) => `<tr><td class="mono">${esc(h.name)}</td><td class="dim">${esc(h.version)}</td><td class="mono dim">${esc(h.time || '—')}</td></tr>`).join('')}</tbody>
        </table>
      </div>` : ''}`;
  },
  init() {
    const r = $('#u-refresh'); if (r) r.addEventListener('click', loadUpdates);
    const i = $('#u-install'); if (i) i.addEventListener('click', () => gate('Automatic update installation', installAllUpdates));
    if (!VIEWS.updates.data) loadUpdates();
  },
};

async function loadUpdates() {
  setBusy(true, 'UPDATE CHECK');
  const res = await api('updates:check');
  if (res) { VIEWS.updates.data = res; if (state.route === 'updates') navigate('updates'); }
  setBusy(false);
}

async function installAllUpdates() {
  confirmDialog('Install updates', 'Start the operating system update installation now? A restart may be required afterwards.', false, async () => {
    setBusy(true, 'UPDATING');
    const res = await api('updates:install');
    setBusy(false);
    if (res) toast(res.note || 'Update process started', res.ok ? 'success' : 'warn');
  });
}

      <div class="feat-grid">
        ${[['zap', 'Unlimited Scans', 'Full-depth filesystem sweeps with no result caps or daily limits.'],
          ['trash', 'One-Click Cleaning', 'Select and permanently remove junk, duplicates and large files in bulk.'],
          ['layers', 'App Removal', 'Uninstall applications directly from the inventory — no control panel needed.'],

      <div class="sec-head" id="plans"><span class="sec-sq"></span><span class="sec-title">Plans</span><span class="sec-line"></span><span class="sec-idx">DEMO CHECKOUT — NO REAL PAYMENT</span></div>
      <div class="grid-2" style="max-width:900px">

          <div class="card-title">PRO · SINGLE DEVICE</div>

          <ul>
            <li>${icon('check')} All PRO modules unlocked</li>
            <li>${icon('check')} Lifetime updates for v1.x</li>
            <li>${icon('check')} 1 device activation</li>

          </ul>
        </div>

          <div class="card-title">PRO · TEAM / FAMILY</div>
          <div class="price">$79.99 <small>one-time</small></div>
          <div class="muted" style="font-size:11px;letter-spacing:.08em">PERPETUAL LICENSE · 5 DEVICES</div>

      <div class="sec-head"><span class="sec-sq"></span><span class="sec-title">Checkout</span><span class="sec-line"></span></div>
      <div class="card" style="max-width:900px">
        <div class="grid-2" style="gap:14px">

    if (isPro()) {
      $('#pr-deact').addEventListener('click', () => {

      $('#ck-pay').innerHTML = `${icon('lock')} Pay $${plan.price} &amp; Activate`;

    $('#ck-card').addEventListener('input', (e) => {

    });
    $('#ck-exp').addEventListener('input', (e) => {
      let d = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (d.length >= 3) d = d.slice(0, 2) + '/' + d.slice(2);
      e.target.value = d;
    });
    $('#ck-pay').addEventListener('click', () => {
      const name = $('#ck-name').value.trim();
      const email = $('#ck-email').value.trim();
      const card = $('#ck-card').value.replace(/\D/g, '');
      const exp = $('#ck-exp').value;
      const cvc = $('#ck-cvc').value;
      if (name.length < 2) return toast('Enter the cardholder name', 'warn');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Enter a valid email address', 'warn');
      if (card.length !== 16) return toast('Card number must be 16 digits', 'warn');
      if (!/^\d{2}\/\d{2}$/.test(exp)) return toast('Expiry must be MM/YY', 'warn');
      if (!/^\d{3,4}$/.test(cvc)) return toast('CVC must be 3-4 digits', 'warn');
      const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(4))).map((b) => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[b % 31]).join('');
      const key = `AEGIS-${rnd()}-${rnd()}-${rnd()}-${rnd()}`;
      activateLicense(key);
    });
    $('#key-activate').addEventListener('click', () => {
      const v = $('#key-input').value.trim().toUpperCase();
      if (!/^AEGIS-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(v)) {
        return toast('Invalid key format — expected AEGIS-XXXX-XXXX-XXXX-XXXX', 'error');
      }
      activateLicense(v);
    });
    $('#pr-key-btn').addEventListener('click', () => { const k = $('#key-input'); if (k) k.focus(); });
  },

async function activateLicense(key) {
  const license = { tier: 'pro', key, since: new Date().toISOString() };
  const saved = await api('license:set', license);
  if (saved) {
    state.license = saved;
    refreshLicenseUI();
    toast('AEGIS PRO activated — all modules unlocked', 'success');
    navigate('pro');
  }
}

function refreshLicenseUI() {
  const chip = $('#lic-chip');
  const label = $('#lic-label');
  if (isPro()) {
    chip.classList.add('pro');
    label.textContent = 'PRO — LICENSED';
  } else {
    chip.classList.remove('pro');
    label.textContent = 'FREE EDITION';
  }
}

/* ============================================================ router */

function navigate(route, opts = {}) {
  activeTimers.forEach(clearInterval);
  activeTimers = [];
  state.route = route;
  $$('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.route === route));
  const view = VIEWS[route];
  $('#view').innerHTML = view.render();
  $('#view').scrollTop = 0;
  const label = view.label || route;
  $('#crumb').innerHTML = `AEGIS <b>//</b> ${esc(label.toUpperCase())}`;
  if (route === 'files' && opts.autoJunk) filesState.autoJunk = true;
  view.init && view.init();
}

/* ------------------------------------------------------------ boot */

function injectIcons() {
  const inject = (root) => {
    root.innerHTML = root.innerHTML.replace(/__ICON_(\w+)__/g, (_m, n) => icon(n.toLowerCase()));
  };
  inject($('#nav'));
  inject($('.nav-foot'));
  inject($('.titlebar-right'));
  $('#brand-mark').innerHTML = LOGO;
}

function startClock() {
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB'); };
  tick();
  setInterval(tick, 1000);
}

async function boot() {
  injectIcons();
  startClock();
  $('#tb-min').addEventListener('click', () => IPC.invoke('win:minimize'));
  $('#tb-max').addEventListener('click', () => IPC.invoke('win:toggleMax'));
  $('#tb-close').addEventListener('click', () => IPC.invoke('win:close'));
  $$('.nav-item').forEach((n) => n.addEventListener('click', () => navigate(n.dataset.route)));

  const lic = await api('license:get');
  if (lic) { state.license = lic; refreshLicenseUI(); }

  const info = await api('sys:info');
  if (info) {
    state.sys = info;
    $('#sb-os').textContent = (info.osCaption || info.platformLabel) + ' · ' + info.arch.toUpperCase() + ' · ' + info.hostname;
    $('#brand-ver').textContent = 'v' + state.version;
  }
  navigate('dashboard');
}

boot();
