<!DOCTYPE html>

<body>

        <button class="nav-item" data-route="updates"><span class="nav-idx">07</span> __ICON_REFRESH__ <span>Updates</span></button>
      </nav>
      <div class="nav-foot">
        <button class="nav-item nav-pro" data-route="pro">__ICON_STAR__ <span>AEGIS PRO</span> <span class="pro-arrow">__ICON_ARROW__</span></button>
      </div>
    </aside>

    <div class="main">
      <header class="titlebar">
        <div class="crumb" id="crumb">AEGIS // DASHBOARD</div>
        <div class="titlebar-right">
          <div class="clock" id="clock">00:00:00</div>
          <div class="tb-sep"></div>
          <button class="tb-btn" id="tb-min" title="Minimize">__ICON_MIN__</button>
          <button class="tb-btn" id="tb-max" title="Maximize">__ICON_MAX__</button>
          <button class="tb-btn tb-close" id="tb-close" title="Close">__ICON_X__</button>
        </div>
      </header>
      <main id="view"></main>
      <footer class="statusbar">
        <span id="sb-os">—</span>
        <span class="sb-sep">|</span>
        <span id="sb-engine">ENGINE v1.0.0</span>
        <span class="sb-sep">|</span>
        <span id="sb-scan">NO SCAN YET</span>
        <span class="sb-right" id="sb-status">READY</span>
      </footer>
    </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
  /* ---- Demo IPC bridge: rich mock data so the UI can be previewed in a browser ---- */
  (function () {
    const GiB = 1024 * 1024 * 1024;
    const sys = {
      hostname: 'DESKTOP-AEGIS', platform: 'linux', platformLabel: 'Linux', arch: 'x64',
      release: '6.8.0', cpus: 16, cpuModel: 'AMD Ryzen 9 7950X 16-Core Processor',
      totalRam: 32 * GiB, freeRam: 11.4 * GiB, uptimeSec: 273840, user: 'alex',
      homedir: '/home/alex', osCaption: 'Ubuntu 24.04.1 LTS', osBuild: '2024', machineModel: 'ASUS ProArt X670E', gpu: 'NVIDIA GeForce RTX 4080',
    };
    const mkProc = (pid, name, cpu, mem, p, company, susp, level, flags) =>
      ({ pid, name, cpu, memBytes: mem, path: p, company, product: '', suspicion: susp, suspicionLevel: level, flags });
    const procs = [
      mkProc(1, 'systemd', 0.1, 12 * 1024 * 1024, '/usr/lib/systemd/systemd', 'freedesktop', 0, 'clean', []),
      mkProc(742, 'gnome-shell', 6.4, 780 * 1024 * 1024, '/usr/bin/gnome-shell', 'GNOME', 0, 'clean', []),
      mkProc(1391, 'firefox', 12.8, 2.4 * GiB, '/usr/lib/firefox/firefox', 'Mozilla', 8, 'medium', ['Elevated CPU usage']),
      mkProc(2210, 'code', 3.1, 1.1 * GiB, '/usr/share/code/code', 'Microsoft', 0, 'clean', []),
      mkProc(3107, 'postgres', 1.9, 340 * 1024 * 1024, '/usr/lib/postgresql/16/bin/postgres', 'PostgreSQL', 0, 'clean', []),

      mkProc(5233, 'discord', 2.2, 480 * 1024 * 1024, '/usr/share/discord/discord', 'Discord Inc.', 0, 'clean', []),
      mkProc(6102, 'dockerd', 0.4, 210 * 1024 * 1024, '/usr/bin/dockerd', 'Docker', 0, 'clean', []),
      mkProc(7441, 'xmrig', 96.2, 512 * 1024 * 1024, '/tmp/.cache/xmrig', '', 98, 'critical',
        ['Name matches a known cryptominer signature', 'Executable located in a temporary directory', 'Abnormally high CPU usage (96%)']),
      mkProc(8012, 'chrome', 4.7, 1.6 * GiB, '/opt/google/chrome/chrome', 'Google', 0, 'clean', []),
      mkProc(8890, 'mystery-app', 41.0, 980 * 1024 * 1024, '/var/tmp/mystery-app', '', 53, 'high',
        ['Executable located in a temporary directory', 'Abnormally high CPU usage (41%)', 'No executable path exposed (packed or hidden process)']),
      mkProc(9021, 'backupd', 0.2, 88 * 1024 * 1024, '/usr/local/bin/backupd', '', 0, 'clean', []),
    ];
    const apps = [
      { name: 'Firefox', version: '131.0', publisher: 'Mozilla', size: 240 * 1024 * 1024, flags: [], uninstallString: '', package: 'firefox', path: '' },
      { name: 'Visual Studio Code', version: '1.94.0', publisher: 'Microsoft', size: 380 * 1024 * 1024, flags: [], uninstallString: '', package: 'code', path: '' },
      { name: 'Docker Desktop', version: '4.34.2', publisher: 'Docker Inc', size: 620 * 1024 * 1024, flags: [], uninstallString: '', package: 'docker-desktop', path: '' },
      { name: 'VLC media player', version: '3.0.20', publisher: 'VideoLAN', size: 150 * 1024 * 1024, flags: [], uninstallString: '', package: 'vlc', path: '' },
      { name: 'Super Speed PC Optimizer 2026', version: '7.2', publisher: '', size: 0, flags: [{ label: 'Possible bloatware', sev: 'high' }, { label: 'Unknown publisher', sev: 'medium' }], uninstallString: '', package: '', path: '' },
      { name: 'Unknown Driver Updater', version: '3.1', publisher: '', size: 0, flags: [{ label: 'Possible bloatware', sev: 'high' }, { label: 'Unknown publisher', sev: 'medium' }], uninstallString: '', package: '', path: '' },
    ];
    const conns = [
      { proto: 'TCP', local: '0.0.0.0:22', remote: '0.0.0.0:*', state: 'LISTEN', pid: 812, process: 'sshd' },
      { proto: 'TCP', local: '127.0.0.1:5432', remote: '0.0.0.0:*', state: 'LISTEN', pid: 3107, process: 'postgres' },
      { proto: 'TCP', local: '0.0.0.0:2375', remote: '0.0.0.0:*', state: 'LISTEN', pid: 6102, process: 'dockerd' },
      { proto: 'TCP', local: '127.0.0.1:631', remote: '0.0.0.0:*', state: 'LISTEN', pid: 990, process: 'cupsd' },
      { proto: 'TCP', local: '192.168.1.14:51234', remote: '142.250.74.46:443', state: 'ESTABLISHED', pid: 1391, process: 'firefox' },
      { proto: 'TCP', local: '192.168.1.14:51877', remote: '185.199.108.133:443', state: 'ESTABLISHED', pid: 2210, process: 'code' },
      { proto: 'TCP', local: '192.168.1.14:44210', remote: '91.189.91.83:993', state: 'ESTABLISHED', pid: 5233, process: 'discord' },
      { proto: 'UDP', local: '0.0.0.0:5353', remote: '*', state: 'LISTEN', pid: 742, process: 'gnome-shell' },
      { proto: 'UDP', local: '0.0.0.0:68', remote: '*', state: 'LISTEN', pid: 640, process: 'systemd-network' },
      { proto: 'TCP', local: '192.168.1.14:60012', remote: '45.155.205.233:9001', state: 'ESTABLISHED', pid: 7441, process: 'xmrig' },
    ];
    const updItems = [
      { name: 'openssl', version: '3.0.13-0ubuntu3.4', source: 'apt (Ubuntu 24.04)' },
      { name: 'linux-firmware', version: '20240318.git3b128b60-0ubuntu2.14', source: 'apt (Ubuntu 24.04)' },
      { name: 'google-chrome-stable', version: '130.0.6723.58-1', source: 'apt (Google LLC)' },
    ];
    const errItems = [
      { time: '2026-10-09 08:14:22', source: 'kernel', id: '', message: 'nvme0n1: I/O error, dev nvme0n1, sector 20481920 op 0x1:(WRITE)' },
      { time: '2026-10-09 07:52:10', source: 'systemd', id: '', message: 'Failed to start Application Sandboxing Daemon — unit failed' },
      { time: '2026-10-08 23:41:55', source: 'dockerd', id: '', message: 'Error starting daemon: error opening listener: address already in use' },
      { time: '2026-10-08 19:03:37', source: 'gnome-shell', id: '', message: 'JS ERROR: TypeError: window is undefined in resource:///org/gnome/shell/ui' },

    const junkResults = Array.from({ length: 12 }, (_, i) => ({
      path: ['/tmp/.cache/app-' + i + '.log', '/home/alex/.cache/pip/http-' + i, '/var/tmp/old-install-' + i + '.tmp', '/home/alex/.cache/thumbnails/fail-' + i + '.png'][i % 4],
      size: 124 * 1024 * 1024 - i * 7 * 1024 * 1024,
      kind: ['Log file', 'Cache', 'Backup / temp', 'System junk'][i % 4],
    }));
    const scanQuick = {
      system: sys,
      disks: [{ device: '/dev/nvme0n1p2', mount: '/', label: 'Ubuntu', size: 1.86 * 1024 * GiB, used: 1.42 * 1024 * GiB, free: 440 * 1024 * 1024 * 1024 }],

      durationMs: 2340,
    };
    const canned = {
      'license:get': { tier: 'free', key: null, since: null },
      'license:set': (p) => p,
      'sys:info': sys,
      'disk:usage': scanQuick.disks,
      'scan:quick': scanQuick,
      'scan:files': { mode: 'junk', roots: ['default'], scanned: 184322, bytes: 96 * 1024 * 1024 * 1024, truncated: false, durationMs: 3120, count: 12, reclaimable: 612 * 1024 * 1024, results: junkResults },
      'files:clean': { removed: 12, failed: 0, bytes: 612 * 1024 * 1024 },
      'proc:list': procs,
      'proc:kill': { ok: true, error: null },
      'apps:list': apps,
      'apps:uninstall': { ok: true, error: null },
      'net:list': { connections: conns, listening: conns.filter((c) => /LISTEN/.test(c.state)) },
      'fw:status': scanQuick.firewall,
      'fw:enable': { ok: true, error: null },
      'enc:status': scanQuick.encryption,
      'updates:check': { items: updItems, history: [], lastInstalled: '2026-10-01', daysSinceLastUpdate: 8, rebootRequired: false, note: '3 package update(s) available' },
      'updates:install': { ok: true, note: 'Update installation started — a restart may be required' },
      'errors:list': { items: errItems, window: 'last 24h (journal, err level)' },
      'dialog:pickDir': null,
      'report:save': '/home/alex/aegis-sentinel-report.json',
      'win:minimize': null, 'win:toggleMax': null, 'win:close': null,
    };
    window.aegis = {
      invoke: (channel, payload) => {
        const v = canned[channel];
        if (v === undefined) return Promise.resolve({ ok: false, error: 'demo: unknown channel ' + channel });
        return Promise.resolve({ ok: true, data: typeof v === 'function' ? v(payload) : v });
      },
      on: () => () => {},
    };
  })();
  </script>
