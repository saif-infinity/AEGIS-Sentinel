<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS Sentinel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div class="brand-text">
          <span class="brand-name">AEGIS</span>
          <span class="brand-sub">SENTINEL <em id="brand-ver">v1.0.0</em></span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-route="dashboard"><span class="nav-idx">01</span> __ICON_GRID__ <span>Dashboard</span></button>
        <button class="nav-item" data-route="files"><span class="nav-idx">02</span> __ICON_FOLDER__ <span>File Scanner</span></button>
        <button class="nav-item" data-route="processes"><span class="nav-idx">03</span> __ICON_CHIP__ <span>Processes</span></button>
        <button class="nav-item" data-route="apps"><span class="nav-idx">04</span> __ICON_LAYERS__ <span>Applications</span></button>
        <button class="nav-item" data-route="network"><span class="nav-idx">05</span> __ICON_GLOBE__ <span>Network</span></button>
        <button class="nav-item" data-route="persistence"><span class="nav-idx">06</span> __ICON_POWER__ <span>Startup &amp; Services</span></button>
        <button class="nav-item" data-route="audit"><span class="nav-idx">07</span> __ICON_SHIELD__ <span>Security Audit</span></button>
        <button class="nav-item" data-route="updates"><span class="nav-idx">08</span> __ICON_REFRESH__ <span>Updates</span></button>
      </nav>
    </aside>

    <div class="main">
      <header class="titlebar">
        <div class="crumb" id="crumb">AEGIS // DASHBOARD</div>
        <div class="titlebar-right">
          <div class="clock" id="clock">00:00:00</div>
          <div class="tb-sep"></div>
          <button class="tb-btn" id="tb-min" title="Minimize">__ICON_MIN__</button>
          <button class="tb-btn" id="tb-max" title="Maximize">__ICON_MAX__</button>
          <button class="tb-btn tb-close" id="tb-close" title="Close">__ICON_X__</button>
        </div>
      </header>
      <main id="view"></main>
      <footer class="statusbar">
        <span id="sb-os">—</span>
        <span class="sb-sep">|</span>
        <span id="sb-engine">ENGINE v1.0.0</span>
        <span class="sb-sep">|</span>
        <span id="sb-scan">NO SCAN YET</span>
        <span class="sb-right" id="sb-status">READY</span>
      </footer>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="./renderer.js"></script>
</body>
</html>
